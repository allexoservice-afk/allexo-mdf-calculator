# Cloudflare Pages (статичний сайт після `pnpm run build` → папка `dist`).
# Functions: functions/api/proposal-delivery.js → POST /api/proposal-delivery
name = "allexo-mdf-calculator-v2"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Публічні змінні (не секрети). RESEND_API_KEY — лише в Dashboard або .dev.vars
[vars]
OWNER_EMAIL = "info@allexo.be"
RESEND_FROM_EMAIL = "ALLEXO <info@allexo.be>"
ALLOWED_ORIGINS = "https://allexo.be,https://www.allexo.be,https://allexo-mdf-calculator.pages.dev,http://localhost:5173,http://localhost:5174"
