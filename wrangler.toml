# Cloudflare Pages (статичний сайт після `pnpm run build` → папка `dist`).
# Functions: functions/api/proposal-delivery.js → POST /api/proposal-delivery
name = "allexo-mdf-calculator-v2"
compatibility_date = "2024-12-01"
pages_build_output_dir = "dist"

# Локальні / публічні. RESEND_API_KEY, RESEND_FROM_EMAIL, OWNER_EMAIL — у Dashboard (Production).
# Secret-тип у UI часто НЕ потрапляє в context.env → додайте RESEND_API_KEY як Plaintext (Encrypt).
[vars]
ALLOWED_ORIGINS = "https://allexo.be,https://www.allexo.be,https://allexo-mdf-calculator-v2.pages.dev,http://localhost:5173,http://localhost:5174"
