<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>ALLEXO — back render</title>
  <style>
    :root {
      --gold: #c4a35a;
      --black: #000000;
      --white: #ffffff;
      --canvas-w: 1051px;
      --canvas-h: 697px;
      --bleed-px: 24px;
      --trim-w: 1004px;
      --trim-h: 650px;
      --safe-back: 65px;
      --back-icon-col: 59px;
      --back-icon-gap: 24px;
      --back-row-gap: 18px;
      --back-font-service: 18px;
      --back-font-contact: 21px;
      --back-font-phone: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: var(--canvas-w);
      height: var(--canvas-h);
      overflow: hidden;
      background: var(--black);
      font-family: "Montserrat", "Segoe UI", system-ui, sans-serif;
      color: var(--white);
    }
    .trim {
      width: var(--trim-w);
      height: var(--trim-h);
      margin: var(--bleed-px);
      background: var(--black);
    }
    .card__safe {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 41px;
      height: 100%;
      padding: var(--safe-back) 71px;
    }
    .back-col { min-width: 0; height: 100%; display: flex; align-items: center; }
    .back-divider-wrap { align-self: center; height: 425px; display: flex; align-items: center; }
    .back-divider { width: 3px; height: 100%; background: var(--gold); }
    .back-list { list-style: none; display: flex; flex-direction: column; width: 100%; gap: var(--back-row-gap); }
    .back-item { display: grid; grid-template-columns: var(--back-icon-col) 1fr; gap: var(--back-icon-gap); align-items: center; }
    .back-item__icon { width: 50px; height: 50px; color: var(--gold); justify-self: center; }
    .back-item__text { font-size: var(--back-font-service); font-weight: 500; letter-spacing: 0.04em; line-height: 1.25; text-transform: uppercase; }
    .back-item__text--contact { font-size: var(--back-font-contact); letter-spacing: 0.015em; text-transform: none; }
    .back-item__text--phone { font-size: var(--back-font-phone); font-weight: 700; letter-spacing: 0.03em; }
  </style>
</head>
<body>
  <div class="trim">
    <div class="card__safe">
      <div class="back-col">
        <ul class="back-list">
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="14" rx="1"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="12" y1="5" x2="12" y2="19"/></svg><span class="back-item__text">Binnenafwerking van raamdagkanten (MDF / PVC)</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="14" height="18" rx="1"/><circle cx="14" cy="13" r="1.2" fill="currentColor" stroke="none"/><line x1="12" y1="3" x2="12" y2="21"/></svg><span class="back-item__text">Montage van ramen en deuren</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg><span class="back-item__text">Onderhoud &amp; herstellingen</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="1"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="7" y1="10" x2="7" y2="18"/><line x1="11" y1="10" x2="11" y2="18"/><line x1="15" y1="10" x2="15" y2="18"/></svg><span class="back-item__text">Rolluiken</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h18v10H3z"/><line x1="7" y1="8" x2="7" y2="18"/><line x1="12" y1="8" x2="12" y2="18"/><line x1="17" y1="8" x2="17" y2="18"/></svg><span class="back-item__text">Garagepoorten</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="16" height="14" rx="1"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="12" x2="17" y2="12"/><line x1="7" y1="15" x2="17" y2="15"/></svg><span class="back-item__text">Horren</span></li>
        </ul>
      </div>
      <div class="back-divider-wrap"><div class="back-divider"></div></div>
      <div class="back-col">
        <ul class="back-list">
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="8"/><ellipse cx="12" cy="12" rx="3.5" ry="8"/><line x1="4" y1="12" x2="20" y2="12"/></svg><span class="back-item__text back-item__text--contact">www.allexo.be</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="18" height="12" rx="1.5"/><path d="M3 8l9 6 9-6"/></svg><span class="back-item__text back-item__text--contact">info@allexo.be</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="3" width="14" height="18" rx="1.5"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="14" y2="12"/></svg><span class="back-item__text back-item__text--contact">BTW BE 1022.379.505</span></li>
          <li class="back-item"><svg class="back-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 4.5c2 4 4.5 6.5 8.5 8.5l2-2c.4-.4 1-.5 1.5-.2 1.6.9 3.4 1.5 5 1.7.6.1 1 .6 1 1.2v3c0 .6-.5 1.1-1.1 1.1C10.2 18.8 5.2 13.8 4.2 6.6 4.1 6 4.6 5.5 5.2 5.5H8c.6 0 1.1.4 1.2 1 .2 1.6.8 3.4 1.7 5 .3.5.2 1.1-.2 1.5l-2 2z"/></svg><span class="back-item__text back-item__text--contact back-item__text--phone">+32 493 86 07 53</span></li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
